[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-vcr"
version = "0.2.0"
description = "Record and replay LLM HTTP traffic for deterministic pytest runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9", "types-PyYAML>=6.0"]

[project.entry-points.pytest11]
llm_vcr = "llm_vcr.plugin"

[project.scripts]
llm-vcr = "llm_vcr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_vcr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_vcr"]
