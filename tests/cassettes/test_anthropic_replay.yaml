name: anthropic_messages
interactions:
  - method: POST
    url: https://api.anthropic.com/v1/messages
    request_headers:
      content-type: application/json
      x-api-key: "[REDACTED]"
    request_body:
      model: claude-3-5-sonnet
      max_tokens: 64
      messages:
        - role: user
          content: Say hello
    status_code: 200
    response_headers:
      content-type: application/json
    response_body:
      id: msg_test
      type: message
      role: assistant
      content:
        - type: text
          text: Hello!
      model: claude-3-5-sonnet
      stop_reason: end_turn
