name: streaming_hello
interactions:
  - method: POST
    url: https://api.openai.com/v1/chat/completions
    request_headers:
      content-type: application/json
    request_body:
      model: gpt-4o-mini
      stream: true
      messages:
        - role: user
          content: Say hello
    streaming: true
    chunks:
      - "data: {\"id\":\"1\",\"choices\":[{\"delta\":{\"content\":\"Hello\"}}]}\n\n"
      - "data: {\"id\":\"1\",\"choices\":[{\"delta\":{\"content\":\"!\"}}]}\n\n"
      - "data: [DONE]\n\n"
    status_code: 200
    response_headers:
      content-type: text/event-stream
